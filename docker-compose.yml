services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih_cv_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # Pass custom frontend origins (e.g. from LAN or other computers) as comma-separated list
      - ALLOWED_ORIGINS=http://localhost:5174,http://localhost:5173
      - MLFLOW_ALLOW_FILE_STORE=true
      - MLFLOW_DISABLE_AGENT_HINT=1
    volumes:
      # Persist SQLite MLflow tracking data across container lifecycles
      - mlflow_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mlflow_data:
